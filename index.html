<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<title>セミナー参加特典｜任せて伸ばす 自走サロン経営セミナー</title>
<!-- まりえ 11月勝ち組セミナー 参加特典の受け取りページ 2026-11-21 版
     まゆこ指示「参加特典はまずこの5つですと出しつつ、特典のサムネと、特典を受け取るボタン、特典のタイトルのみ」「5つはつながっています…いらなくて、入会面談を一番上に」
     土台＝11/18 ももこ版 https://kachigumi-seminar-tokuten.netlify.app/ の見た目。PDFリンクも同じ5本。 -->
<style>
:root{
  --text:#3C2C24; --sub:#7A6656; --beige:#F4ECE4; --gold:#C4943C; --gold-d:#744C14; --gold-l:#E4D4B4;
  --gg:linear-gradient(180deg,#D8B060 0%,#B8862F 48%,#7A5216 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#E9DFD4;color:var(--text);font-family:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;-webkit-font-smoothing:antialiased;line-height:1.7}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:480px;margin:0 auto;background:var(--beige);min-height:100vh;overflow:hidden}
.en{font-family:Georgia,serif;font-style:italic;letter-spacing:.22em;color:var(--gold);font-size:12px;text-align:center}
.h2{font-size:25px;line-height:1.45;text-align:center;font-weight:900;letter-spacing:.04em}
.h2 em,.ttl em{font-style:normal;background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:80px;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.nw{white-space:nowrap}

/* FV＝お礼＋5つの一覧 */
.fv{background:linear-gradient(180deg,#FFFFFF 0%,#F8F3EC 55%,#F4ECE4 100%);padding:30px 0 26px}
.fv .sem{display:block;width:max-content;max-width:calc(100% - 32px);margin:10px auto 0;font-size:13px;font-weight:700;letter-spacing:.06em;
  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:5px 14px;text-align:center}
.fv .h2{margin-top:16px}
.fv .lead{margin:14px 24px 0;text-align:center;font-size:14.5px;line-height:1.9}
.fv .lead b{font-weight:900;color:var(--gold-d)}
.five{margin:22px 16px 0;background:#fff;border-radius:14px;padding:18px 12px 20px;box-shadow:0 3px 12px rgba(90,60,30,.08)}
.five .ttl{text-align:center;font-size:20px;font-weight:900;letter-spacing:.06em}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 8px;margin-top:14px}
.it{width:calc((100% - 16px)/3);text-align:center}
.it img{width:100%;border-radius:4px;box-shadow:0 2px 6px rgba(70,50,20,.15)}
.it .no{display:inline-block;margin-top:6px;background:var(--text);color:#F1DDAE;font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:1px 9px;border-radius:20px}
.it .nm{margin-top:3px;font-size:11px;font-weight:700;line-height:1.45}
.fv .tap{margin-top:20px;text-align:center;font-size:14px;font-weight:700;line-height:1.7;color:var(--gold-d)}

/* 特典 */
.tok{padding:12px 0 14px;scroll-margin-top:8px}
.tok.first{padding-top:18px}
.card{margin:0 16px;background:#fff;border-radius:14px;padding:18px 16px 20px;box-shadow:0 3px 12px rgba(90,60,30,.08)}
.head{display:flex;align-items:center;gap:10px}
.tag{flex:0 0 auto;background:var(--text);color:#F1DDAE;font-size:12.5px;font-weight:700;letter-spacing:.08em;padding:3px 11px;border-radius:30px}
.card .nm{font-size:16px;font-weight:900;line-height:1.45}
.card img{width:100%;border-radius:8px;margin-top:12px;box-shadow:0 2px 8px rgba(70,50,20,.12)}
.desc{margin-top:14px;font-size:14.5px;line-height:1.85;word-break:auto-phrase}
.btn{position:relative;display:flex;align-items:center;justify-content:center;height:58px;margin:18px 4px 0;border-radius:40px;
  background:linear-gradient(180deg,#F6E3AE 0%,#DDB25C 26%,#B07F2C 62%,#7E5518 100%);box-shadow:0 4px 0 #6A4512,0 6px 12px rgba(70,40,5,.25);
  transition:transform .08s,box-shadow .08s}
.btn:before{content:"";position:absolute;left:18px;right:18px;top:4px;height:22px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0))}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6A4512,0 2px 6px rgba(70,40,5,.25)}
.btn .t{position:relative;font-size:19px;font-weight:900;color:#fff;letter-spacing:.1em;text-shadow:0 2px 3px rgba(90,55,10,.75)}
.btn .ar{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#fff;
  color:var(--gold-d);font-family:Georgia,serif;font-size:22px;line-height:27px;font-weight:700;text-align:center}
.pdf{margin-top:10px;text-align:center;font-size:12px;color:var(--sub)}

/* 結び */
.end{padding:22px 0 36px}
.end .box{margin:0 24px;text-align:center;font-size:16px;line-height:1.95;font-weight:700}
.end .first{margin:16px 24px 0;background:#fff;border:1px solid var(--gold-l);border-radius:12px;padding:14px 14px;text-align:center;font-size:14.5px;line-height:1.85}
.end .first b{font-weight:900;color:var(--gold-d)}
.end .note{margin:14px 24px 0;text-align:center;font-size:12.5px;line-height:1.7;color:var(--sub)}

/* 入会面談 */
.join{padding:4px 0 40px}
.join .txt{margin:0 24px;text-align:center;font-size:14.5px;line-height:1.95}
.join .lk{display:flex;align-items:center;justify-content:center;gap:8px;width:max-content;margin:20px auto 0;font-size:15.5px;font-weight:900;color:var(--gold-d);
  border:1.5px solid var(--gold);border-radius:40px;padding:10px 28px;background:#fff;letter-spacing:.06em}
.join .lk .ar{font-family:Georgia,serif;font-size:18px;line-height:1}
.foot{margin-top:34px;text-align:center;font-size:11.5px;letter-spacing:.14em;color:var(--sub)}

/* 2026-11-21 まゆこ指示版：入会面談を一番上／5大特典の画像／特典はサムネ・タイトル・ボタンだけ */
.top{padding:22px 16px 6px}
.join2{background:#fff;border:1.5px solid var(--gold);border-radius:14px;padding:18px 16px 20px;text-align:center;box-shadow:0 3px 12px rgba(90,60,30,.08)}
.join2 .en{margin-bottom:6px}
.join2 .h{font-size:20px;font-weight:900;letter-spacing:.06em;line-height:1.5}
.join2 .d{margin-top:6px;font-size:14.5px;font-weight:700;color:var(--gold-d)}
.join2 .btn{margin:14px 0 0}
.thx{padding:30px 20px 0;text-align:center}
.thx p{font-size:16px;font-weight:700;line-height:1.9;letter-spacing:.03em}
.gift{padding:18px 0 4px;text-align:center}
.gift .h2{margin-top:8px}
.gift .bn{width:calc(100% - 32px);margin:16px auto 0;border-radius:12px;box-shadow:0 3px 12px rgba(90,60,30,.12)}
.tok .card img{margin-top:12px}
.tok.sp{padding-top:18px}
.card.sp{border:2px solid var(--gold);background:linear-gradient(180deg,#FFFDF8,#FFF7E8)}
.tag.sp{background:var(--gg);color:#fff}
.due{margin-top:12px;text-align:center;font-size:14.5px;font-weight:700;color:var(--gold-d)}
.due b{font-weight:900}
</style></head>
<body><div class="wrap">

  <img src="img/tok5.jpg" alt="特典5　新人育成ロードマップ" width="1000" height="563" loading="lazy">
